<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Faculty Notes Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
background-size:400% 400%;
animation:gradient 12s ease infinite;

}

@keyframes gradient{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.navbar{

background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);

}

.navbar-brand{

font-size:28px;
font-weight:bold;

}

.nav-link{

color:white!important;
font-weight:500;

}

.hero{

min-height:90vh;
display:flex;
align-items:center;

}

.hero h1{

font-size:60px;
font-weight:700;
color:white;

animation:slideDown 1.5s;

}

.hero p{

color:white;
font-size:20px;

}

.btn-custom{

padding:14px 35px;
border-radius:50px;
font-size:20px;
font-weight:600;
transition:.4s;

}

.btn-custom:hover{

transform:scale(1.1);

}

.floating{

animation:floating 4s ease-in-out infinite;

}

@keyframes floating{

0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}

}

@keyframes slideDown{

from{

opacity:0;
transform:translateY(-60px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.section-title{

font-size:40px;
font-weight:bold;
color:white;
margin-bottom:40px;

}

.card{

border:none;
border-radius:20px;
transition:.4s;
box-shadow:0 15px 35px rgba(0,0,0,.2);

}

.card:hover{

transform:translateY(-10px);

}

.counter{

font-size:40px;
font-weight:bold;
color:#0d6efd;

}

footer{

background:#111;
color:white;
padding:25px;
text-align:center;

}

</style>

</head>

<body>
    <!-- ================= NAVIGATION ================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="/">📚 Faculty Notes Portal</a>

<button class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#features">Features</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#about">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#contact">Contact</a>
</li>

</ul>

</div>

</div>

</nav>


<!-- ================= HERO SECTION ================= -->

<section class="hero">

<div class="container">

<div class="row align-items-center">

<!-- Left Side -->

<div class="col-lg-6">

<h1>

Faculty Notes Portal

</h1>

<p class="mt-4">

A Smart Platform to Upload, Manage and Share Faculty Notes.

Developed using Flask, SQLite, Bootstrap, GitHub and Jenkins.

</p>

<div class="mt-5">

<a href="/login"
class="btn btn-warning btn-custom me-3">

Faculty Login

</a>

<a href="/register"
class="btn btn-success btn-custom">

Faculty Registration

</a>

</div>

</div>


<!-- Right Side -->

<div class="col-lg-6 text-center">

<img
src="{{ url_for('static', filename='images/laptop.png') }}"
class="img-fluid floating"
style="max-height:500px;">

</div>

</div>

</div>

</section>
