<!DOCTYPE html>
<html>
<head>
    <title>View Notes</title>
</head>
<body>

<h1>Uploaded Notes</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Subject</th>
        <th>Unit</th>
        <th>File Name</th>
    </tr>

    {% for note in notes %}
    <tr>
        <td>{{ note[0] }}</td>
        <td>{{ note[1] }}</td>
        <td>{{ note[2] }}</td>
        <td>
            <a href="/download/{{ note[3] }}">Download</a>
            |
            <a href="/delete/{{ note[0] }}">Delete</a>
        </td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
